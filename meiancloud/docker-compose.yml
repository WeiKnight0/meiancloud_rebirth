services:
  mysql:
    image: mysql:8.0
    container_name: meiancloud_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meianclouddata}
      MYSQL_USER: ${MYSQL_USER:-meianclouddata}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-SRZyhMDrMrCaWdpA}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meiancloud_django
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.sqlite3}
      DB_NAME: ${DB_NAME:-db.sqlite3}
      DB_USER: ${DB_USER:-meianclouddata}
      DB_PASSWORD: ${DB_PASSWORD:-SRZyhMDrMrCaWdpA}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
    command: sh -c "python manage.py migrate && python manage.py ensure_admin_user && python manage.py collectstatic --noinput && gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  nginx:
    image: nginx:alpine
    container_name: meiancloud_nginx
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

volumes:
  mysql_data:
  static_data:
  media_data:
